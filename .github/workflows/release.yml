name: Release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Version without leading v, for example 0.1.0
        required: true

permissions:
  contents: write

jobs:
  release:
    name: Signed and notarized release
    runs-on: macos-14
    env:
      APP_NAME: mq-dir
      DEVELOPER_DIR: /Applications/Xcode_16.2.app/Contents/Developer
      DEVELOPMENT_TEAM: ${{ secrets.DEVELOPMENT_TEAM }}
      APPLE_CERTIFICATE_BASE64: ${{ secrets.APPLE_CERTIFICATE_BASE64 }}
      APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
      APPLE_KEYCHAIN_PASSWORD: ${{ secrets.APPLE_KEYCHAIN_PASSWORD }}
      APPLE_API_KEY_BASE64: ${{ secrets.APPLE_API_KEY_BASE64 }}
      APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
      APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
      # File-backup form of the Sparkle EdDSA private key, base64-encoded.
      # Generate locally with `Scripts/sparkle-setup.sh`, then paste:
      #   base64 ~/.config/mq-dir-release/sparkle/ed_priv | pbcopy
      # into Repository Settings → Secrets → SPARKLE_ED_PRIVATE_KEY.
      SPARKLE_ED_PRIVATE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Full history so the release-notes step can compute commit
          # subjects between the previous tag and this one.
          fetch-depth: 0

      - name: Resolve version
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            VERSION="${{ inputs.version }}"
          else
            VERSION="${GITHUB_REF_NAME#v}"
          fi
          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "TAG=v${VERSION}" >> "$GITHUB_ENV"

      - name: Check signing inputs
        run: |
          test -n "$DEVELOPMENT_TEAM"
          test -n "$APPLE_CERTIFICATE_BASE64"
          test -n "$APPLE_CERTIFICATE_PASSWORD"
          test -n "$APPLE_KEYCHAIN_PASSWORD"
          test -n "$APPLE_API_KEY_BASE64"
          test -n "$APPLE_API_KEY_ID"
          test -n "$APPLE_API_ISSUER_ID"
          test -n "$SPARKLE_ED_PRIVATE_KEY"

      - name: Install build tools
        run: |
          # XcodeGen for project regeneration; create-dmg for the layout-rich
          # installer that Scripts/release.sh used to produce locally. Without
          # create-dmg the runner would fall back to bare `hdiutil create`,
          # which ships a DMG with no Applications symlink, no .DS_Store, no
          # background — that's the regression that broke v0.1.0-beta.7.
          if ! command -v xcodegen   >/dev/null 2>&1; then brew install xcodegen;   fi
          if ! command -v create-dmg >/dev/null 2>&1; then brew install create-dmg; fi
          xcodegen --version
          create-dmg --version

      - name: Install Sparkle CLI
        run: |
          # Sparkle's binary release ships sign-update / generate-keys, which
          # are absent from the SwiftPM checkout. Same provisioning scheme as
          # Scripts/sparkle-setup.sh, but unattended.
          SPARKLE_VERSION=2.6.4
          TOOLS_DIR="$RUNNER_TEMP/sparkle"
          mkdir -p "$TOOLS_DIR"
          curl -fL "https://github.com/sparkle-project/Sparkle/releases/download/${SPARKLE_VERSION}/Sparkle-${SPARKLE_VERSION}.tar.xz" \
            -o "$RUNNER_TEMP/sparkle.tar.xz"
          tar -C "$TOOLS_DIR" -xJf "$RUNNER_TEMP/sparkle.tar.xz"
          # Sparkle 2.6.x renamed sign_update → sign-update; resolve either.
          if   [ -x "$TOOLS_DIR/bin/sign-update" ]; then
            echo "SIGN_UPDATE=$TOOLS_DIR/bin/sign-update" >> "$GITHUB_ENV"
          elif [ -x "$TOOLS_DIR/bin/sign_update" ]; then
            echo "SIGN_UPDATE=$TOOLS_DIR/bin/sign_update" >> "$GITHUB_ENV"
          else
            echo "Sparkle sign-update binary not found under $TOOLS_DIR/bin" >&2
            ls -la "$TOOLS_DIR/bin" >&2
            exit 1
          fi

      - name: Import Developer ID certificate
        run: |
          CERT_PATH="$RUNNER_TEMP/developer-id.p12"
          KEYCHAIN_PATH="$RUNNER_TEMP/release.keychain-db"
          printf "%s" "$APPLE_CERTIFICATE_BASE64" | base64 -D > "$CERT_PATH"
          security create-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERT_PATH" -P "$APPLE_CERTIFICATE_PASSWORD" -A -t cert -f pkcs12 -k "$KEYCHAIN_PATH"
          security set-key-partition-list -S apple-tool:,apple: -s -k "$APPLE_KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"

      - name: Generate project
        run: xcodegen generate

      - name: Archive app
        run: |
          xcodebuild archive \
            -project mq-dir.xcodeproj \
            -scheme mq-dir \
            -configuration Release \
            -archivePath "$RUNNER_TEMP/mq-dir.xcarchive" \
            DEVELOPMENT_TEAM="$DEVELOPMENT_TEAM" \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Developer ID Application" \
            OTHER_CODE_SIGN_FLAGS="--timestamp"

      - name: Export app
        run: |
          cat > "$RUNNER_TEMP/ExportOptions.plist" <<PLIST
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key>
            <string>developer-id</string>
            <key>signingStyle</key>
            <string>manual</string>
            <key>teamID</key>
            <string>${DEVELOPMENT_TEAM}</string>
            <key>stripSwiftSymbols</key>
            <true/>
          </dict>
          </plist>
          PLIST
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/mq-dir.xcarchive" \
            -exportPath "$RUNNER_TEMP/export" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Notarize and staple app
        run: |
          APP_PATH="$RUNNER_TEMP/export/${APP_NAME}.app"
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          NOTARY_ZIP="$RUNNER_TEMP/${APP_NAME}-notary.zip"
          printf "%s" "$APPLE_API_KEY_BASE64" | base64 -D > "$AUTH_KEY_PATH"
          chmod 600 "$AUTH_KEY_PATH"
          codesign --verify --deep --strict --verbose=2 "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$NOTARY_ZIP"
          xcrun notarytool submit "$NOTARY_ZIP" \
            --key "$AUTH_KEY_PATH" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID" \
            --wait
          xcrun stapler staple "$APP_PATH"

      - name: Package DMG with installer layout
        run: |
          # Mirrors Scripts/release.sh exactly so the locally-cut DMG and the
          # CI-cut DMG present identical Finder layouts. Volname must stay
          # plain "${APP_NAME}" — including the version (e.g. "mq-dir 0.1.0")
          # makes Finder open a default-sized window with no Applications
          # symlink, which is the regression beta.7 shipped with.
          APP_PATH="$RUNNER_TEMP/export/${APP_NAME}.app"
          mkdir -p dist
          DMG_PATH="dist/${APP_NAME}-v${VERSION}.dmg"
          ZIP_PATH="dist/${APP_NAME}-v${VERSION}.zip"
          rm -f "$DMG_PATH" "$ZIP_PATH"
          create-dmg \
            --volname "${APP_NAME}" \
            --window-size 540 380 \
            --background "Resources/installer/dmg_background.png" \
            --icon-size 128 \
            --icon "${APP_NAME}.app" 135 170 \
            --app-drop-link 385 170 \
            "$DMG_PATH" \
            "$APP_PATH"
          ditto -c -k --keepParent "$APP_PATH" "$ZIP_PATH"

      - name: EdDSA-sign DMG with Sparkle key
        run: |
          # Sign the DMG bytes that will actually be uploaded so Sparkle's
          # signature on the appcast matches what users download. Detached
          # signing (no DMG bytes change) — output is one line of attribute
          # text that we splice straight into the enclosure tag.
          DMG_PATH="dist/${APP_NAME}-v${VERSION}.dmg"
          PRIV="$RUNNER_TEMP/sparkle-priv"
          printf "%s" "$SPARKLE_ED_PRIVATE_KEY" | base64 -D > "$PRIV"
          chmod 600 "$PRIV"
          SIG_LINE="$("$SIGN_UPDATE" -f "$PRIV" "$DMG_PATH")"
          # Wipe immediately. The EdDSA seed is the keys-to-the-kingdom for
          # publishing updates; don't leave it on disk past the sign call.
          shred -u "$PRIV" 2>/dev/null || rm -f "$PRIV"
          # Multi-line-safe stash via heredoc env: SIG_LINE is single-line
          # but using the delimiter form avoids surprises if Sparkle ever
          # adds a trailing newline.
          {
            echo "SIG_LINE<<__SIG_EOF__"
            echo "$SIG_LINE"
            echo "__SIG_EOF__"
          } >> "$GITHUB_ENV"

      - name: Generate SHA256SUMS
        run: |
          cd dist
          shasum -a 256 ./* | grep -v SHA256SUMS > SHA256SUMS

      - name: Publish GitHub release
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            # Pre-existing release (manual workflow_dispatch re-run, or a
            # tag that was previously published). Replace assets so the
            # download URL keeps pointing at the freshly-built bytes that
            # match the appcast EdDSA signature we're about to commit.
            gh release upload "$TAG" dist/* --clobber
          else
            PREV_TAG="$(git describe --tags --abbrev=0 "${TAG}^" 2>/dev/null || true)"
            NOTES_FILE="$(mktemp)"
            if [ -n "$PREV_TAG" ]; then
              {
                echo "## What's Changed"
                echo
                # Skip the auto-generated "Release vX.Y.Z" bump commit so it
                # doesn't sit at the top of every release's notes as noise.
                git log "${PREV_TAG}..${TAG}" --pretty=format:'- %s' \
                  | grep -vE '^- Release v[0-9]' || true
                echo
                echo
                echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/${PREV_TAG}...${TAG}"
              } > "$NOTES_FILE"
            else
              echo "Initial release." > "$NOTES_FILE"
            fi
            gh release create "$TAG" dist/* \
              --title "${APP_NAME} ${TAG}" \
              --notes-file "$NOTES_FILE"
            rm -f "$NOTES_FILE"
          fi

      - name: Update appcast and cask, push to main
        run: |
          # Splice + commit happens AFTER the release upload so a publish
          # failure doesn't leave appcast pointing at a release that
          # doesn't exist yet. If this step fails, the published artifacts
          # are still fine — re-run the workflow or hand-edit appcast.
          DMG_NAME="${APP_NAME}-v${VERSION}.dmg"
          DMG_PATH="dist/${DMG_NAME}"
          DMG_URL="https://github.com/${{ github.repository }}/releases/download/${TAG}/${DMG_NAME}"
          PUBDATE="$(LC_TIME=C date -u +"%a, %d %b %Y %H:%M:%S +0000")"
          DMG_SHA="$(shasum -a 256 "$DMG_PATH" | cut -d' ' -f1)"

          # Switch onto a fresh copy of main BEFORE editing — the tag we
          # built from is detached, and main may have moved while CI ran.
          git config user.name  "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git checkout -B post-release origin/main

          # Splice <item> just above </channel>. Mirrors Scripts/release.sh.
          TMP_APPCAST="$(mktemp)"
          APPCAST_VER="${VERSION}" \
          APPCAST_URL="${DMG_URL}" \
          APPCAST_SIG="${SIG_LINE}" \
          APPCAST_PUB="${PUBDATE}" \
          awk '
          BEGIN {
              ver = ENVIRON["APPCAST_VER"]
              url = ENVIRON["APPCAST_URL"]
              sig = ENVIRON["APPCAST_SIG"]
              pub = ENVIRON["APPCAST_PUB"]
          }
          /<\/channel>/ {
              print "    <item>"
              print "      <title>Version " ver "</title>"
              print "      <pubDate>" pub "</pubDate>"
              print "      <sparkle:version>" ver "</sparkle:version>"
              print "      <sparkle:shortVersionString>" ver "</sparkle:shortVersionString>"
              print "      <sparkle:minimumSystemVersion>14.0</sparkle:minimumSystemVersion>"
              print "      <enclosure url=\"" url "\" " sig " type=\"application/octet-stream\" />"
              print "    </item>"
          }
          { print }
          ' docs/appcast.xml > "$TMP_APPCAST"
          mv "$TMP_APPCAST" docs/appcast.xml

          grep -q "<sparkle:version>${VERSION}</sparkle:version>" docs/appcast.xml \
            || { echo "appcast splice missed — check </channel> regex" >&2; exit 1; }
          if command -v xmllint >/dev/null; then
            xmllint --noout docs/appcast.xml
          fi

          sed -i '' "s/version \".*\"/version \"${VERSION}\"/" "Casks/${APP_NAME}.rb"
          sed -i '' "s/sha256 \".*\"/sha256 \"${DMG_SHA}\"/" "Casks/${APP_NAME}.rb"

          git add docs/appcast.xml "Casks/${APP_NAME}.rb"
          if git diff --cached --quiet; then
            echo "no appcast/cask delta — skipping push"
            exit 0
          fi
          git commit -m "Update appcast and cask for ${TAG}"
          git push origin HEAD:main

      # The notary .p8 holds a long-lived App Store Connect API key.
      # GitHub-hosted runners are ephemeral, but any subsequent step or
      # compromised dependency action could read it before the runner
      # tears down — so wipe it on every exit path, success or failure.
      - name: Wipe notary credentials
        if: always()
        run: |
          AUTH_KEY_PATH="$RUNNER_TEMP/AuthKey_${APPLE_API_KEY_ID}.p8"
          if [ -f "$AUTH_KEY_PATH" ]; then
            shred -u "$AUTH_KEY_PATH" 2>/dev/null || rm -f "$AUTH_KEY_PATH"
          fi
