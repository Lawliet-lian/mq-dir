name: mq-dir
options:
  bundleIdPrefix: com.mqdir
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  generateEmptyDirectories: true
  # 本地化配置：声明支持的语言，使 XcodeGen 在生成 project 时
  # 将 en.lproj 和 zh-Hans.lproj 视作语言专属资源组。
  # developmentRegion 为英文（和原项目发布基线一致）。
  developmentLanguage: en
  localization:
    paths:
      - Resources

settings:
  base:
    SWIFT_VERSION: "5.10"
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: "8"
    CODE_SIGN_STYLE: Automatic
    DEVELOPMENT_TEAM: "WKV6T7K33K"
    MACOSX_DEPLOYMENT_TARGET: "14.0"
    ENABLE_HARDENED_RUNTIME: YES
    SWIFT_STRICT_CONCURRENCY: complete

packages:
  MarkdownUI:
    url: https://github.com/gonzalezreal/swift-markdown-ui
    from: 2.4.0
  Sparkle:
    url: https://github.com/sparkle-project/Sparkle
    from: 2.6.0

targets:
  mq-dir:
    type: application
    platform: macOS
    sources:
      - path: Sources/mq-dir
      - path: Sources/mqdirCore
      - path: Resources
        excludes:
          - "Entitlements/**"
    dependencies:
      - package: MarkdownUI
        product: MarkdownUI
      - package: Sparkle
        product: Sparkle
    info:
      path: Sources/mq-dir/Info.plist
      properties:
        CFBundleIdentifier: com.mqdir.app
        CFBundleDisplayName: mq-dir
        CFBundleShortVersionString: "0.2.0"
        # Monotonic build number — `Scripts/release.sh` increments this
        # alongside MARKETING_VERSION on every release. Sparkle's
        # SUStandardVersionComparator compares the appcast item's
        # `<sparkle:version>` against the host's CFBundleVersion;
        # pre-beta.12 we shipped every release with CFBundleVersion="1",
        # so the comparator decided "0.1.0-beta.N" < "1" (tokenization
        # ranks the leading 0 below 1) and silently reported "up to
        # date" on every Check for Updates. Keeping this an integer
        # that climbs per release restores Sparkle's ordering on every
        # install — including the broken builds in the wild, since
        # their next appcast fetch will see a larger integer.
        CFBundleVersion: "7"
        LSApplicationCategoryType: public.app-category.utilities
        LSMinimumSystemVersion: "14.0"
        NSHighResolutionCapable: true
        NSDesktopFolderUsageDescription: mq-dir needs access to your Desktop to browse files there.
        NSDocumentsFolderUsageDescription: mq-dir needs access to your Documents to browse files there.
        NSDownloadsFolderUsageDescription: mq-dir needs access to your Downloads to browse files there.
        NSRemovableVolumesUsageDescription: mq-dir needs access to your removable volumes to browse files there.
        NSNetworkVolumesUsageDescription: mq-dir needs access to your network volumes to browse files there.
        # Sparkle auto-update — appcast lives on GitHub Pages, public EdDSA
        # key is generated by `Scripts/release.sh` on first signed release
        # and pasted here. Until then SUPublicEDKey is empty and Sparkle
        # will refuse to *install* updates (the safe default), but the
        # check / UI flow exercises end-to-end.
        SUFeedURL: https://h5nam.github.io/mq-dir/appcast.xml
        SUPublicEDKey: "IY4tnuP6Qv2cFSouGhddHVrD015Ffz6KsycibEJVJxw="
        SUEnableAutomaticChecks: true
        SUScheduledCheckInterval: 86400
    entitlements:
      path: Resources/Entitlements/mq-dir.entitlements
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.mqdir.app
        PRODUCT_NAME: mq-dir
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        COMBINE_HIDPI_IMAGES: YES
        ENABLE_PREVIEWS: YES
      configs:
        # Debug overrides the project-wide Automatic + DEVELOPMENT_TEAM
        # signing with an ad-hoc identity ("-") so local Debug builds
        # don't prompt for keychain access on every CodeSign step
        # (Sparkle.framework re-signing was the recurring offender).
        # Release/Sandboxed inherit the base Automatic + team for the
        # signed/notarized release pipeline.
        Debug:
          CODE_SIGN_STYLE: Manual
          CODE_SIGN_IDENTITY: "-"
          DEVELOPMENT_TEAM: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        Sandboxed:
          CODE_SIGN_ENTITLEMENTS: Resources/Entitlements/mq-dir-sandboxed.entitlements
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: "$(inherited) MQDIR_SANDBOXED"

configs:
  Debug: debug
  Release: release
  Sandboxed: release

schemes:
  mq-dir:
    build:
      targets:
        mq-dir: all
    run:
      config: Debug
    test:
      config: Debug
    archive:
      config: Release
